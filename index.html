<!doctype html>
<!-- DOCTYPE: This declaration instructs the browser to render the page according to HTML5 standards instead of quirks mode. -->
<html lang="en">
  <!-- lang="en": This attribute specifies that the primary language of the page is English, which helps screen readers and search engines interpret the content properly. -->
  <head>
    <!-- charset="utf-8": This sets the character encoding first inside <head> so that all letters, punctuation, and symbols in <title> and the document display correctly. -->
    <meta charset="utf-8" />
    <!-- viewport: This tells mobile browsers to match the page width to the device screen for proper scaling on smaller devices. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- description: This meta tag provides a short summary of the page content for search engine results. -->
    <meta
      name="description"
      content="A practical cheatsheet covering five graphic design techniques to turn cluttered drafts into clean, readable layouts."
    />
    <!-- title: This defines the page title that appears in the browser tab and bookmarks. -->
    <title>Blank Canvas to Clean Layout: 5 Graphic Design Techniques</title>
  </head>
  <!-- body: This element contains all the visible content of the webpage, such as headings, text, lists, and images. -->
  <body></body>
</html>
